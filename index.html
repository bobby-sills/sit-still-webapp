<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="A meditation timer that uses the camera to notice when your attention drifts. Frames are read and discarded in the tab — no upload, no recording, no account."
    />
    <!-- The breathing orb, inline: keeps the "no image assets" rule and
         still gives the tab an icon instead of a 404. -->
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" fill="%23000"/><circle cx="16" cy="16" r="7" fill="%23fff" opacity=".85"/></svg>' />
    <!-- Inter, variable, 100-400: the design uses thin weights that most
         systems have no font for. Helvetica is not licensable this way, and
         only Apple devices have it at all. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..400&display=swap"
    />
    <title>Still — a meditation timer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
